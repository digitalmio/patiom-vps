name = "patiom-worker-logs"
main = "src/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[[queues.consumers]]
  queue = "patiom-logs-queue"
  max_batch_size = 10
  max_retries = 10
  dead_letter_queue = "patiom-logs-dlq"

# IP -> country lookups use the IPLocate API, cached at the edge via the
# Workers Cache API (keyed by SHA-256 of the IP) for IP_GEO_TTL_DAYS
# (default 5). The API key is a secret:
#   wrangler secret put IPLOCATE_KEY
# vars = { IP_GEO_TTL_DAYS = "5" }

# DATABASE_URL is no longer used. DB access goes through the shared
# Hyperdrive binding below. Local dev connects directly using:
#   CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
# (see scripts/dev)

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000-0000-0000-0000-000000000000" # TODO: real id after `wrangler hyperdrive create patiom-primary`
