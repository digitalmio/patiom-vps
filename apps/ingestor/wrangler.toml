name = "patiom-ingestor"
main = "src/index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

# Matches the SDK's built-in default endpoint, so client integrations
# need no PATIOM_ENDPOINT env var.
routes = [{ pattern = "ingest.patiom.dev", custom_domain = true }]

[[queues.producers]]
  binding = "SCHEMA_QUEUE"
  queue = "patiom-schema-queue"

[[queues.producers]]
  binding = "LOGS_QUEUE"
  queue = "patiom-logs-queue"

# DATABASE_URL is no longer used. DB access goes through the shared
# Hyperdrive binding below. Local dev connects directly using:
#   CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE
# (see scripts/dev)

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "00000000-0000-0000-0000-000000000000" # TODO: real id after `wrangler hyperdrive create patiom-primary`
